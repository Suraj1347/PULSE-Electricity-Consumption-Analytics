services:
  # ------------------------------------------------------------------
  # HDFS — 1 namenode + 3 datanodes (replication factor 3)
  # ------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: pulse-namenode
    hostname: namenode
    restart: unless-stopped
    ports:
      - "9870:9870" # HDFS web UI
      - "9000:9000" # HDFS RPC
    volumes:
      - namenode-data:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=pulse
    env_file:
      - ./docker/hadoop.env

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: pulse-datanode1
    hostname: datanode1
    restart: unless-stopped
    depends_on:
      - namenode
    volumes:
      - datanode1-data:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./docker/hadoop.env
    ports:
      - "9864:9864"

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: pulse-datanode2
    hostname: datanode2
    restart: unless-stopped
    depends_on:
      - namenode
    volumes:
      - datanode2-data:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./docker/hadoop.env
    ports:
      - "9865:9864"

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: pulse-datanode3
    hostname: datanode3
    restart: unless-stopped
    depends_on:
      - namenode
    volumes:
      - datanode3-data:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./docker/hadoop.env
    ports:
      - "9866:9864"

  # One-shot job: creates /pulse/raw + /pulse/output and uploads the dataset.
  # Equivalent of hdfs_setup.ps1. Run with:
  #   docker compose --profile tools run --rm hdfs-init
  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: pulse-hdfs-init
    hostname: hdfs-init
    profiles: ["tools"]
    depends_on:
      - namenode
      - datanode1
      - datanode2
      - datanode3
    env_file:
      - ./docker/hadoop.env
    volumes:
      - .:/workspace:ro
      - ./docker/hdfs-init.sh:/hdfs-init.sh:ro
    command: ["/bin/bash", "/hdfs-init.sh"]

  # ------------------------------------------------------------------
  # Spark — standalone cluster, 1 master + 2 workers
  # ------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.3
    container_name: pulse-spark-master
    hostname: spark-master
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080" # Spark master web UI
      - "7077:7077" # Spark master RPC

  spark-worker1:
    image: apache/spark:3.5.3
    container_name: pulse-spark-worker1
    hostname: spark-worker1
    restart: unless-stopped
    depends_on:
      - spark-master
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "--cores", "2",
        "--memory", "2g",
        "spark://spark-master:7077",
      ]
    ports:
      - "8081:8081"

  spark-worker2:
    image: apache/spark:3.5.3
    container_name: pulse-spark-worker2
    hostname: spark-worker2
    restart: unless-stopped
    depends_on:
      - spark-master
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "--cores", "2",
        "--memory", "2g",
        "spark://spark-master:7077",
      ]
    ports:
      - "8082:8081"

  # One-shot job: spark-submit spark_processing.py against the cluster above.
  # Equivalent of `python spark_processing.py`. Run with:
  #   docker compose --profile tools run --rm spark-job
  spark-job:
    build:
      context: .
      dockerfile: docker/spark-job/Dockerfile
    container_name: pulse-spark-job
    profiles: ["tools"]
    depends_on:
      - namenode
      - spark-master
      - spark-worker1
      - spark-worker2
    environment:
      - HDFS_NAMENODE=hdfs://namenode:9000
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./results:/opt/spark/work-dir/results
    command:
      [
        "/opt/spark/bin/spark-submit",
        "--master", "spark://spark-master:7077",
        "spark_processing.py",
      ]

  # ------------------------------------------------------------------
  # Kafka streaming replay (optional) — profile "streaming"
  #   docker compose --profile streaming up -d
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: pulse-kafka
    hostname: kafka
    profiles: ["streaming"]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:19093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  # Replays household_power_consumption.txt into the pulse-readings topic
  # at an accelerated, looping rate (see docker/kafka-producer/producer.py).
  kafka-producer:
    build:
      context: docker/kafka-producer
    container_name: pulse-kafka-producer
    profiles: ["streaming"]
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP=kafka:19092
      - KAFKA_TOPIC=pulse-readings
      - DATASET_PATH=/workspace/household_power_consumption.txt
      - RATE_PER_SEC=20
      - LOOP=true
    volumes:
      - .:/workspace:ro

  # Consumes the topic with Spark Structured Streaming (local mode — this
  # workload is tiny and doesn't need the standalone cluster) and writes a
  # live JSON snapshot straight into public/data/ for the dashboard to poll.
  spark-streaming:
    build:
      context: .
      dockerfile: docker/spark-job/Dockerfile
    container_name: pulse-spark-streaming
    profiles: ["streaming"]
    restart: unless-stopped
    depends_on:
      - kafka
      - kafka-producer
    environment:
      - KAFKA_BOOTSTRAP=kafka:19092
      - KAFKA_TOPIC=pulse-readings
      - LIVE_OUT_PATH=/opt/spark/work-dir/live_out/live_stream.json
    volumes:
      - ./public/data:/opt/spark/work-dir/live_out
    command:
      [
        "/opt/spark/bin/spark-submit",
        "--master", "local[*]",
        "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3",
        "spark_streaming.py",
      ]

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  datanode3-data:
